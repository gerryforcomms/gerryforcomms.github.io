  homeInfoParams:
    Title: "Hi, I'm Gerry 🐈"
    Content: >
      I am an artist. I love cats. I am also allergic to cats.


      My art is inspired by the happenings around me; observations that touched something in me or made me chuckle (the likelihood of that being a cat is very high).


      I am a Singapore-born human, living in Sweden since 2019. People call me Gerry, and they say I look like a charmander. Thus the stage name I've had since my time in the Singapore street dance scene - Gerry Mander. 


      Credentials: I hold a Bachelor of Social Science (psychology major) from Singapore Management University. I also lived a decade as a communicator in the corporate world.

